
<!DOCTYPE html>
<html>
<head>
    <title>Class Timetable</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Class Timetable</h1>

    <table>
        <tr>
            <th>Day</th>
            <th>Time Slot</th>
            <th>Subject</th>
            <th>Faculty Name</th>
        </tr>

        {% for slot in timetable %}
        <tr>
            <td>{{ slot.Day }}</td>

            <td>
                {{ slot.Start_Time }} - {{ slot.End_Time }}
            </td>

            <td>{{ slot.Subject_Name }}</td>

            <td>{{ slot.Faculty_Name }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No timetable records available.</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
